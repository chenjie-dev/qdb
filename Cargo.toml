[workspace]
resolver = "2"
members = [
    "crates/qdb-abi",
    "crates/qdb-shm",
    "crates/qdb-wal",
    "crates/qdb-agg",
    "crates/qdb-store",
    "crates/qdb-sql",
    "crates/qdb-sub",
    "crates/qdb-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.78"

[workspace.dependencies]
thiserror = "1"
crc32fast = "1"
memmap2 = "0.9"
libc = "0.2"
qdb-abi = { path = "crates/qdb-abi" }
qdb-shm = { path = "crates/qdb-shm" }
qdb-wal = { path = "crates/qdb-wal" }
qdb-agg = { path = "crates/qdb-agg" }
qdb-store = { path = "crates/qdb-store" }
qdb-sql = { path = "crates/qdb-sql" }
qdb-sub = { path = "crates/qdb-sub" }
